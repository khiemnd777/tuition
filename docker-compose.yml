name: finance_hub

services:
  api:
    container_name: finance_hub_api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: finance_hub-api:local
    restart: unless-stopped
    environment:
      ABC_ENV: ${ABC_ENV:-local}
      ABC_DATABASE_URL_LOCAL: ${ABC_DATABASE_URL_LOCAL:-postgres://abcsun:abcsun_local_password@postgres:5432/abcsun?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: 18080
    ports:
      - "${API_PORT:-18180}:18080"
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    container_name: finance_hub_admin
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: dev
    image: finance_hub-admin:local
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:18080
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${ADMIN_PORT:-18181}:5173"
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    container_name: finance_hub_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abcsun}
      POSTGRES_USER: ${POSTGRES_USER:-abcsun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abcsun_local_password}
    ports:
      - "${POSTGRES_PORT:-15436}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./.docker/postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: finance_hub_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16381}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-./.docker/redis_data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  api_data:
  admin_node_modules:
